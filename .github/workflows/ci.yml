name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  ruby_version: 3.4

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [2.7 ,'3.0', 3.1, 3.2, 3.3, 3.4, 4.0, jruby, truffleruby]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Tests
        env:
          CI: 1
        run: |
          RUBY_VERSION=`ruby -e 'puts RUBY_VERSION'`
          RUBY_PLATFORM=`ruby -e 'puts RUBY_PLATFORM'`
          RUBY_ENGINE=`ruby -e 'puts RUBY_ENGINE'`
          if [[ "$RUBY_ENGINE" = "ruby" ]] && [[ ${RUBY_VERSION:0:1} = "3" ]] && [[ ! $RUBYOPT =~ "jit" ]]; then
            echo "running runtime type checking..."
            export RUBYOPT="-rbundler/setup -rrbs/test/setup"
            export RBS_TEST_RAISE="true"
            export RBS_TEST_LOGLEVEL="error"
            export RBS_TEST_OPT="-Isig -rbase64"
            export RBS_TEST_TARGET="HTTP2*"
          fi
          bundle exec rake
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{matrix.ruby}}
          path: coverage/
          include-hidden-files: true

  coverage:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Download coverage results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          path: coverage

      - name: coverage
        env:
          CI: 1
        run: |
          find coverage -name "*resultset.json" -exec sed -i 's?${{ github.workspace }}?'`pwd`'?' {} \;
          bundle exec rake coverage:report

      - uses: srozen/simplecov-check-action@f4736294d46ee3746289412eeb031aed47072aef # support-simplecov-1
        if: ${{ github.repository == 'igrigorik/http-2' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
