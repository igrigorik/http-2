name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CI: 1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [2.7 ,'3.0', 3.1, 3.2, 3.3, 3.4, 4.0, head, jruby, truffleruby]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Tests
        run: |
          RUBY_VERSION=`ruby -e 'puts RUBY_VERSION'`
          RUBY_PLATFORM=`ruby -e 'puts RUBY_PLATFORM'`
          RUBY_ENGINE=`ruby -e 'puts RUBY_ENGINE'`
          if [[ "$RUBY_ENGINE" = "ruby" ]] && [[ ${RUBY_VERSION:0:1} = "4" ]] && [[ ! $RUBYOPT =~ "jit" ]]; then
            echo "running runtime type checking..."
            bundle exec rbs collection install
            export RUBYOPT="-rbundler/setup -rrbs/test/setup"
            export RBS_TEST_RAISE="true"
            export RBS_TEST_LOGLEVEL="error"
            export RBS_TEST_OPT="-Isig -rbase64"
            export RBS_TEST_TARGET="HTTP2*"
          fi
          bundle exec rake
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{matrix.ruby}}
          path: coverage/
          include-hidden-files: true

  coverage:
    permissions:
      id-token: write
      pages: write
      checks: write
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0
          bundler-cache: true

      - name: Download coverage results
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage

      - name: coverage
        env:
          COVERAGE_DIR: coverage/merged
        run: |
          bundle exec rake coverage:report

      - name: Upload simplecov results
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage
        if: github.ref == 'refs/heads/main'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        if: github.ref == 'refs/heads/main'

      - name: Check coverage
        uses: srozen/simplecov-check-action@support-simplecov-1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          coverage_path: 'coverage/merged/.last_run.json'
          coverage_json_path: 'coverage/merged/coverage.json'
          minimum_suite_coverage: 93
